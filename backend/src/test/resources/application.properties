spring.application.name=employeemanagement-test

# Test H2 in-memory DB
spring.datasource.url=jdbc:h2:mem:employeedb_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway Configuration for tests
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Dedicated Test JWT Secret (>= 256 bits)
jwt.secret=test-environment-jwt-secret-key-32-chars-minimum-length-for-hmac-sha256-safety
jwt.expiration-ms=86400000

# Dedicated Test Admin Provisioning
app.security.initial-admin.enabled=true
app.security.initial-admin.username=admin
app.security.initial-admin.password=admin123
