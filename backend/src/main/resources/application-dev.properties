# ============================================================
# DEVELOPMENT / LOCAL PROFILE CONFIGURATION (spring.profiles.active=dev)
# ============================================================

spring.datasource.url=jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console is enabled only in development profile
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA SQL Logging for debugging
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
