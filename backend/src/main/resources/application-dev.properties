# ============================================================
# DEVELOPMENT PROFILE
# Activate with: spring.profiles.active=dev
# ============================================================

spring.datasource.url=jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=dev-environment-local-jwt-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256

app.security.initial-admin.enabled=true
app.security.initial-admin.username=admin
app.security.initial-admin.password=admin123