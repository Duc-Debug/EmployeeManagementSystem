# ============================================================
# PRODUCTION ENVIRONMENT CONFIGURATION
# ============================================================

# Reject migrations whose version is older than the latest applied migration.
spring.flyway.out-of-order=false

# Production Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT Secret (Must be >= 32 characters)
jwt.secret=${JWT_SECRET}

# Enforce fail-fast configuration: APP_RESET_PASSWORD_BASE_URL must be explicitly provided in production.
# No fallback to localhost allowed in production.
app.auth.reset-password-base-url=${APP_RESET_PASSWORD_BASE_URL}

# Production SMTP configuration placeholders (required by JavaMailSender constructor injection)
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.backup.encryption-key=${APP_BACKUP_ENCRYPTION_KEY}
app.outbox.encryption-key=${APP_OUTBOX_ENCRYPTION_KEY}

# Production Redis Configuration for Token Blacklist & Session Revocation
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2000ms}

