spring.application.name=employeemanagement
server.port=${SERVER_PORT:8080}

# Tự động nạp file .env từ thư mục backend hoặc thư mục gốc dự án
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Cấu hình Cơ sở dữ liệu (Tương thích cả biến SPRING_DATASOURCE_... lẫn biến EMS_DB_... của Team)
spring.datasource.url=${SPRING_DATASOURCE_URL:${EMS_DB_URL:jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${EMS_DB_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${EMS_DB_PASSWORD:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# H2 Console (Tự động bật/tắt theo cấu hình)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}

# Cấu hình Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Cấu hình JPA & Hibernate (Validate schema chuẩn xác, không tự sửa bảng)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}


# JWT Security Configuration
# Injected via environment variable (JWT_SECRET). Defaults to a secure 256-bit key for local development.
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F41428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initial Admin Provisioning Configuration
# Defaults to admin / admin123 if INITIAL_ADMIN_PASSWORD is not specified.
app.security.initial-admin.enabled=${INITIAL_ADMIN_ENABLED:true}
app.security.initial-admin.username=${INITIAL_ADMIN_USERNAME:admin}
app.security.initial-admin.password=${INITIAL_ADMIN_PASSWORD:admin123}