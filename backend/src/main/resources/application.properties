spring.application.name=employeemanagement
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.open-in-view=false

# JWT
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Default security setting
app.security.initial-admin.enabled=false

# Password Reset Configuration (Frontend UI URL)
app.auth.reset-password-base-url=${APP_RESET_PASSWORD_BASE_URL:http://localhost:3000/reset-password}

# Internal Machine-to-Machine Notification Token (Must be configured via environment variable)
app.security.internal-token=${APP_SECURITY_INTERNAL_TOKEN:}

# NCL-14-CN-003: Daily Outsourced Contract Expiration Scan (08:00 AM)
app.scheduler.outsourced-contract-scan.cron=${APP_SCHEDULER_OUTSOURCED_CONTRACT_SCAN_CRON:0 0 8 * * *}
