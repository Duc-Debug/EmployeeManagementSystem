spring.application.name=employeemanagement
server.port=8088

# Import .env file tự động trong Spring Boot
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# MySQL Datasource (Đọc từ tệp .env)
spring.datasource.url=${EMS_DB_URL:jdbc:mysql://localhost:3306/employee_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${EMS_DB_USERNAME:root}
spring.datasource.password=${EMS_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration