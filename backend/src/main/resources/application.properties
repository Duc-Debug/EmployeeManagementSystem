spring.application.name=employeemanagement
server.port=8080

# Database Configuration (Configurable via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console is DISABLED by default for security in production environments
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}

# Flyway Configuration - Single Source of Truth
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA Configuration - Hibernate strictly validates schema without modifying it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

# JWT Security Configuration
# Injected via environment variable (JWT_SECRET). Fails startup if missing or shorter than 256 bits.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initial Admin Provisioning Configuration
# In production, inject INITIAL_ADMIN_PASSWORD via environment variable or secret manager.
app.security.initial-admin.enabled=${INITIAL_ADMIN_ENABLED:true}
app.security.initial-admin.username=${INITIAL_ADMIN_USERNAME:admin}
app.security.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}