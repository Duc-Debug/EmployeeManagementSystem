spring.application.name=employeemanagement
server.port=${PORT:${SERVER_PORT:8080}}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.open-in-view=false

# JWT
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Default security setting
app.security.initial-admin.enabled=false

# Password Reset Configuration (Frontend UI URL)
app.auth.reset-password-base-url=${APP_RESET_PASSWORD_BASE_URL:http://localhost:3000/reset-password}

# Internal Machine-to-Machine Notification Token (Must be configured via environment variable)
app.security.internal-token=${APP_SECURITY_INTERNAL_TOKEN:}

# NCL-14-CN-003: Daily Outsourced Contract Expiration Scan (08:00 AM)
app.scheduler.outsourced-contract-scan.cron=${APP_SCHEDULER_OUTSOURCED_CONTRACT_SCAN_CRON:0 0 8 * * *}

# Backup & Outbox Encryption Keys (AES-GCM 256-bit key derived from secret)
app.backup.encryption-key=${APP_BACKUP_ENCRYPTION_KEY:}
app.outbox.encryption-key=${APP_OUTBOX_ENCRYPTION_KEY:}

# CORS Allowed Origins
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# ==========================================
# Cấu hình Swagger UI & OpenAPI 3 (P2-9)
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.persist-authorization=true



