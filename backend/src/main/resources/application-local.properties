# ============================================================
# LOCAL DEVELOPMENT PROFILE
# ============================================================
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/employee_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

spring.h2.console.enabled=false

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
app.email-outbox.poll-delay-ms=${APP_EMAIL_OUTBOX_POLL_DELAY_MS:60000}

jwt.secret=${JWT_SECRET:}

app.security.initial-admin.enabled=${INITIAL_ADMIN_ENABLED:false}
app.security.initial-admin.username=${INITIAL_ADMIN_USERNAME:admin}
app.security.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}
