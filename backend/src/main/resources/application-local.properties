# ============================================================
# LOCAL DEVELOPMENT PROFILE
# ============================================================
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/employee_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.flyway.out-of-order=false
app.email-outbox.poll-delay-ms=${APP_EMAIL_OUTBOX_POLL_DELAY_MS:5000}

jwt.secret=${JWT_SECRET:local-development-jwt-secret-key-must-be-at-least-32-chars-long}

app.security.initial-admin.enabled=${INITIAL_ADMIN_ENABLED:true}
app.security.initial-admin.username=${INITIAL_ADMIN_USERNAME:admin}
app.security.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}

app.security.internal-token=${APP_SECURITY_INTERNAL_TOKEN:local-dev-internal-service-token-only}
app.backup.encryption-key=${APP_BACKUP_ENCRYPTION_KEY:local-development-backup-aes-key-32-chars-minimum}
app.outbox.encryption-key=${APP_OUTBOX_ENCRYPTION_KEY:local-development-outbox-aes-key-32-chars-minimum}

# Local Development Cookie settings (HTTP support on localhost)
app.security.cookie.secure=false
app.security.cookie.same-site=Lax


