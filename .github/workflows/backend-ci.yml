name: Backend CI

on:
  push:
    branches:
      - develop
      - main
    paths:
     - 'backend/**'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Grant execute permission
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw -B verify